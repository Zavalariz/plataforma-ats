<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATS Elite | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { background: #020606; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        #tv_chart_container { height: 100%; width: 100%; background: #020606; }
        
        /* Estilos UI MT5 */
        .input-mt5 { background: #0a0f0e; border: 1px solid #14211e; border-radius: 4px; padding: 10px; color: white; width: 100%; outline: none; text-align: center; font-family: monospace; font-size: 16px; font-weight: bold; }
        .input-sl { border-bottom: 3px solid #ff4444; color: #ff4444; }
        .input-tp { border-bottom: 3px solid #00ffa3; color: #00ffa3; }
        .btn-buy { background: #162e26; border: 1px solid #00ffa3; color: #00ffa3; transition: 0.2s; }
        .btn-sell { background: #2e1616; border: 1px solid #ff4444; color: #ff4444; transition: 0.2s; }
        .btn-buy:active, .btn-sell:active { transform: scale(0.98); opacity: 0.8; }
        
        .nav-tab { flex: 1; text-align: center; padding: 10px; font-size: 10px; font-weight: 800; color: #444; text-transform: uppercase; cursor: pointer; }
        .nav-tab.active { color: #00ffa3; border-top: 2px solid #00ffa3; background: linear-gradient(to bottom, #00ffa310, transparent); }
        
        /* Precios dinámicos en botones */
        .price-main { font-size: 20px; font-weight: 900; line-height: 1; }
        .price-sub { font-size: 10px; vertical-align: super; opacity: 0.8; }
        .price-prefix { font-size: 10px; opacity: 0.8; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="{ tab: 'chart', search: '' }" class="flex flex-col h-screen">

    <header class="h-14 bg-[#0a0f0e] border-b border-[#14211e] flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html' + window.location.search" class="w-8 h-8 flex items-center justify-center rounded-full bg-zinc-900 text-zinc-400">
                <span class="material-icons-round text-sm">arrow_back</span>
            </button>
            <div class="flex flex-col">
                <span id="balance-display" class="text-[#00ffa3] font-mono font-black text-sm">$ 0.00</span>
                <span class="text-[8px] text-zinc-500 uppercase font-bold tracking-widest">Live Balance</span>
            </div>
        </div>
        <div id="acc-badge" class="text-[9px] font-black uppercase px-2 py-1 rounded bg-white/5 border border-white/10 italic text-zinc-500">DEMO</div>
    </header>

    <main class="flex-1 relative overflow-hidden bg-black">
        
        <section x-show="tab === 'quotes'" class="absolute inset-0 bg-[#020606] overflow-y-auto z-[60]" x-cloak>
            <div class="sticky top-0 z-10 bg-[#0a0f0e] p-3 border-b border-[#14211e]">
                <input type="text" x-model="search" placeholder="Buscar mercado..." class="w-full bg-black border border-white/10 rounded-lg py-2 px-4 text-xs outline-none text-white">
            </div>
            <div class="divide-y divide-white/5">
                <template x-for="m in [
                    {s:'R_100', n:'Volatility 100'}, {s:'R_75', n:'Volatility 75'}, {s:'R_50', n:'Volatility 50'},
                    {s:'BOOM1000', n:'Boom 1000'}, {s:'CRASH1000', n:'Crash 1000'}, {s:'1HZ100V', n:'Volatility 100 (1s)'}
                ]">
                    <div x-show="m.n.toLowerCase().includes(search.toLowerCase())" @click="changeMarket(m.s); tab='chart'" class="p-4 flex justify-between active:bg-zinc-900 cursor-pointer">
                        <b class="text-sm" x-text="m.n"></b>
                        <span class="text-[#00ffa3] text-[10px] font-bold italic tracking-tighter">DERIV LIVE</span>
                    </div>
                </template>
            </div>
        </section>

        <section x-show="tab === 'chart'" class="absolute inset-0 flex flex-col">
            <div class="flex-1 relative">
                <div id="tv_chart_container"></div>
            </div>
            
            <div class="bg-[#0a0f0e] border-t border-[#14211e] p-4 shrink-0">
                <div class="flex items-center gap-2 mb-3">
                    <button onclick="adjustLot(-0.01)" class="w-12 h-11 bg-zinc-900 rounded font-bold">-0.01</button>
                    <input type="number" id="lot-input" value="0.10" step="0.01" class="flex-1 input-mt5">
                    <button onclick="adjustLot(0.01)" class="w-12 h-11 bg-zinc-900 rounded font-bold">+0.01</button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="number" id="sl-input" placeholder="S/L (Opcional)" class="input-mt5 input-sl">
                    <input type="number" id="tp-input" placeholder="T/P (Opcional)" class="input-mt5 input-tp">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="executeTrade('MULTDOWN')" class="btn-sell h-16 rounded-lg flex flex-col items-center justify-center">
                        <span class="text-[10px] font-black uppercase mb-1">Sell / Put</span>
                        <div id="sell-price-container" class="font-mono flex items-baseline">
                            <span class="price-prefix">0.0</span><span class="price-main">00</span><span class="price-sub">0</span>
                        </div>
                    </button>
                    <button onclick="executeTrade('MULTUP')" class="btn-buy h-16 rounded-lg flex flex-col items-center justify-center">
                        <span class="text-[10px] font-black uppercase mb-1">Buy / Call</span>
                        <div id="buy-price-container" class="font-mono flex items-baseline">
                            <span class="price-prefix">0.0</span><span class="price-main">00</span><span class="price-sub">0</span>
                        </div>
                    </button>
                </div>
            </div>
        </section>

        <section x-show="tab === 'trading'" class="absolute inset-0 bg-[#020606] p-4 overflow-y-auto z-[60]" x-cloak>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xs font-black uppercase text-zinc-500 tracking-widest">Posiciones Abiertas</h2>
                <button onclick="closeAllTrades()" class="bg-red-500/10 border border-red-500/50 text-red-500 px-3 py-1 rounded text-[9px] font-black uppercase">Cerrar Todo</button>
            </div>
            <div id="active-trades-container" class="space-y-3 pb-24">
                </div>
        </section>
    </main>

    <nav class="h-16 bg-[#0a0f0e] border-t border-[#14211e] flex items-center shrink-0 z-[70]">
        <div @click="tab = 'quotes'" :class="tab === 'quotes' ? 'active' : ''" class="nav-tab">
            <span class="material-icons-round block text-lg">list</span>Mercados
        </div>
        <div @click="tab = 'chart'" :class="tab === 'chart' ? 'active' : ''" class="nav-tab">
            <span class="material-icons-round block text-lg">show_chart</span>Gráfico
        </div>
        <div @click="tab = 'trading'" :class="tab === 'trading' ? 'active' : ''" class="nav-tab">
            <span class="material-icons-round block text-lg">account_balance_wallet</span>Trading
        </div>
    </nav>

    <script type="module">
        import { widget } from './charting_library/charting_library.esm.js';
        import Datafeed from './datafeed.js';
        import { initDerivWSConnection, getSocket } from './streaming.js';

        let tvWidget;
        let activeTrades = {};
        let orderLines = {}; // 🚩 Almacén para las líneas del gráfico

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const activeType = params.get('active_type') || 'demo';
            document.getElementById('acc-badge').innerText = activeType.toUpperCase();

            // --- LÓGICA DE DETECCIÓN DE TOKEN ---
            let selectedToken = null;
            for (let i = 1; i <= 10; i++) {
                const acc = params.get('acct' + i);
                const tok = params.get('token' + i);
                if (!acc || !tok) continue;
                if (activeType === 'demo' && acc.includes('VRTC')) { selectedToken = tok; break; }
                else if (activeType === 'real' && acc.startsWith('CR')) { selectedToken = tok; break; }
            }
            if (selectedToken) {
                localStorage.setItem('selectedAccount', JSON.stringify({ token: selectedToken, type: activeType }));
            }

            // 1. Iniciar WS
            initDerivWSConnection();

            // 2. Cargar TradingView
            tvWidget = new widget({
                symbol: 'R_100',
                interval: '1',
                container: "tv_chart_container",
                library_path: "charting_library/static/",
                datafeed: Datafeed,
                locale: "en",
                theme: "Dark",
                autosize: true,
                disabled_features: ["header_saveload", "header_symbol_search"],
                overrides: {
                    "paneProperties.background": "#020606",
                    "paneProperties.vertGridProperties.color": "#0a0f0e",
                    "paneProperties.horzGridProperties.color": "#0a0f0e",
                    "scalesProperties.textColor": "#666"
                }
            });

            // 3. Escuchar datos de Deriv
            window.addEventListener('deriv_data', (e) => {
                const data = e.detail;
                
                if (data.msg_type === 'balance') {
                    const b = data.balance.balance;
                    const cur = data.balance.currency || 'USD';
                    document.getElementById('balance-display').innerText = `${cur} ${parseFloat(b).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }

                if (data.msg_type === 'tick') {
                    updateButtonPrices(data.tick.quote);
                }

                // --- LOGICA PARA PINTAR EN EL GRÁFICO ---
                // --- LOGICA PARA PINTAR EN EL GRÁFICO (CON FIX DE TIMING) ---
                if (data.msg_type === 'proposal_open_contract') {
                    const contract = data.proposal_open_contract;
                    updateTradeUI(contract);

                    const chart = tvWidget.activeChart();
                    if (!chart) return;

                    // 1. CREACIÓN NATIVA: Si el contrato tiene precio de entrada y no tiene línea aún
                    if (!contract.is_sold && contract.entry_tick && !orderLines[contract.contract_id]) {
                        const color = contract.contract_type === 'MULTUP' ? '#00ffa3' : '#ff4444';
                        
                        // Aquí usamos la API oficial de la librería
                        const line = chart.createOrderLine()
                            .setText(`${contract.contract_type === 'MULTUP' ? 'CALL' : 'PUT'} $${contract.buy_price}`)
                            .setQuantity(`Stake: ${contract.buy_price}`)
                            .setPrice(parseFloat(contract.entry_tick)) // El anclaje al eje de precio
                            .setLineColor(color)
                            .setBodyTextColor("#fff")
                            .setBodyBackgroundColor(color)
                            .setBodyBorderColor(color)
                            .setLineStyle(2); 

                        orderLines[contract.contract_id] = line;
                    }

                    // 2. ACTUALIZACIÓN DINÁMICA: Cambia el color si vas ganando o perdiendo (como MarketView)
                    if (!contract.is_sold && orderLines[contract.contract_id]) {
                        const currentProfit = contract.profit || 0;
                        const dynamicColor = currentProfit >= 0 ? '#00ffa3' : '#ff4444';
                        
                        orderLines[contract.contract_id]
                            .setLineColor(dynamicColor)
                            .setBodyBackgroundColor(dynamicColor)
                            .setBodyBorderColor(dynamicColor)
                            .setText(`${contract.contract_type === 'MULTUP' ? 'CALL' : 'PUT'} (${currentProfit >= 0 ? '+' : ''}${currentProfit.toFixed(2)})`);
                    }

                    // 3. LIMPIEZA: Elimina la línea del motor gráfico al cerrar la operación
                    if (contract.is_sold && orderLines[contract.contract_id]) {
                        orderLines[contract.contract_id].remove();
                        delete orderLines[contract.contract_id];
                    }
                }
            });
        };

        // Cambiar Mercado
        window.changeMarket = (symbol) => {
            tvWidget.setSymbol(symbol, '1', () => {});
        };

        // Ejecutar Operación (CON MULTIPLIER CORREGIDO)
        window.executeTrade = (type) => {
            const socket = getSocket();
            let lot = parseFloat(document.getElementById('lot-input').value);
            
            // Forzamos mínimo de 1.00 por seguridad
            if (isNaN(lot) || lot < 1) {
                lot = 1.00;
                document.getElementById('lot-input').value = "1.00";
            }

            const symbol = tvWidget.activeChart().symbol();

            // Construimos el objeto EXACTO que pide la API de Deriv
            const request = {
                buy: 1,
                price: lot, 
                parameters: {
                    amount: lot,
                    basis: "stake",
                    contract_type: type, // MULTUP o MULTDOWN
                    currency: "USD",
                    multiplier: 100,
                    symbol: symbol
                }
            };

            // Solo agregamos el suscribe si queremos recibir el evento de línea pintada
            request.subscribe = 1;

            // Manejo estricto de SL/TP: Solo si tienen números válidos
            const slValue = document.getElementById('sl-input').value;
            const tpValue = document.getElementById('tp-input').value;
            
            if (slValue || tpValue) {
                request.parameters.limit_order = {};
                if (slValue) request.parameters.limit_order.stop_loss = parseFloat(slValue);
                if (tpValue) request.parameters.limit_order.take_profit = parseFloat(tpValue);
            }

            socket.send(JSON.stringify(request));
            console.log("🚀 Enviando orden blindada...", request);
        };

        window.closeT = (id) => {
            getSocket().send(JSON.stringify({ sell: id, price: 0 }));
        };

        window.closeAllTrades = () => {
            Object.keys(activeTrades).forEach(id => window.closeT(id));
        };
    </script>

    <script>
        function adjustLot(v) {
            const input = document.getElementById('lot-input');
            input.value = (parseFloat(input.value) + v).toFixed(2);
        }

        function updateButtonPrices(price) {
            const pStr = price.toFixed(4);
            const prefix = pStr.slice(0, -3);
            const main = pStr.slice(-3, -1);
            const sub = pStr.slice(-1);

            const html = `<span class="price-prefix">${prefix}</span><span class="price-main">${main}</span><span class="price-sub">${sub}</span>`;
            document.getElementById('sell-price-container').innerHTML = html;
            document.getElementById('buy-price-container').innerHTML = html;
        }

        function updateTradeUI(c) {
            const id = c.contract_id;
            const container = document.getElementById('active-trades-container');
            
            if (c.is_sold) {
                document.getElementById(`t-${id}`)?.remove();
                return;
            }

            let tradeDiv = document.getElementById(`t-${id}`);
            if (!tradeDiv) {
                tradeDiv = document.createElement('div');
                tradeDiv.id = `t-${id}`;
                tradeDiv.className = "bg-[#0a0f0e] border border-white/5 rounded-lg overflow-hidden";
                container.prepend(tradeDiv);
            }

            const profit = c.profit || 0;
            const colorClass = profit >= 0 ? 'text-[#00ffa3]' : 'text-red-500';

            tradeDiv.innerHTML = `
                <div class="p-2 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <span class="text-[9px] font-black uppercase tracking-tighter text-zinc-400">${c.display_name}</span>
                    <button onclick="closeT(${id})" class="text-red-500 text-[9px] font-bold uppercase">Cerrar</button>
                </div>
                <div class="p-3 grid grid-cols-2 gap-y-1 text-[8px] font-bold uppercase text-zinc-500">
                    <div>Entrada: <span class="text-white font-mono">${c.entry_tick || '...'}</span></div>
                    <div class="text-right">Stake: <span class="text-white font-mono">$ ${c.buy_price}</span></div>
                    <div class="col-span-2 pt-2 border-t border-white/5 flex justify-between items-center">
                        <span class="text-zinc-400">Profit/Loss:</span>
                        <span class="text-base font-black font-mono tracking-tighter ${colorClass}">$ ${profit.toFixed(2)}</span>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
