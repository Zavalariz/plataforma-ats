<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Elite Terminal | Pro Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:,">
    <style>
        body { background: #020606; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        #tv_chart_container { height: calc(100vh - 140px); width: 100%; background: #020606; }
        .glass-header { background: rgba(10, 15, 14, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #14211e; }
        .btn-buy { background: #00ffa3; color: #000; font-weight: 800; transition: all 0.2s; }
        .btn-sell { background: #ff4444; color: #fff; font-weight: 800; transition: all 0.2s; }
        .btn-buy:active, .btn-sell:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="h-16 glass-header flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-4">
            <div class="flex flex-col">
                <span id="balance" class="text-[#00ffa3] font-mono text-xl font-black">$ 0.00</span>
                <span class="text-[9px] text-zinc-500 uppercase tracking-widest font-bold">Balance Real Time</span>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-lg border border-white/5">
                <div id="connection-indicator" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_red]"></div>
                <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-tighter">Deriv Server</span>
            </div>
            <button onclick="window.location.href='dashboard.html' + window.location.search" class="text-xs text-zinc-500 hover:text-white transition-colors uppercase font-bold">Cerrar</button>
        </div>
    </header>

    <div id="tv_chart_container"></div>

    <footer class="h-20 bg-[#0a0f0e] border-t border-[#14211e] p-4 flex items-center justify-center gap-4">
        <div class="grid grid-cols-2 gap-4 w-full max-w-4xl">
            <button onclick="alert('Venta ejecutada')" class="btn-sell h-12 rounded-xl uppercase text-xs tracking-widest shadow-lg shadow-red-900/20">
                Sell / Put
            </button>
            <button onclick="alert('Compra ejecutada')" class="btn-buy h-12 rounded-xl uppercase text-xs tracking-widest shadow-lg shadow-emerald-900/20">
                Buy / Call
            </button>
        </div>
    </footer>

    <script type="module">
        import { widget } from './charting_library/charting_library.esm.js';
        import Datafeed from './datafeed.js';
        import { initDerivWSConnection } from './streaming.js';

        window.onload = () => {
            // 1. CAPTURAR TOKENS DEL DASHBOARD
            const params = new URLSearchParams(window.location.search);
            const token1 = params.get('token1');
            const activeType = params.get('active_type') || 'demo';

            if (token1) {
                // Guardamos para que lo use streaming.js
                localStorage.setItem('selectedAccount', JSON.stringify({
                    token: token1,
                    type: activeType
                }));
            }

            // 2. INICIAR CONEXIÓN WEBSOCKET
            initDerivWSConnection();

            // 3. INICIALIZAR GRÁFICO PROFESIONAL
            const tvWidget = new widget({
                symbol: 'R_100', // Símbolo por defecto
                interval: '1',
                container: "tv_chart_container",
                library_path: "charting_library/static/", 
                datafeed: Datafeed,
                locale: "en",
                theme: "Dark",
                autosize: true,
                loading_screen: { backgroundColor: "#020606" },
                disabled_features: [
                    "header_saveload",
                    "study_templates",
                    "use_localstorage_for_settings",
                    "header_symbol_search",
                    "symbol_search_hot_key"
                ],
                enabled_features: ["side_toolbar_in_fullscreen_mode"],
                overrides: {
                    "paneProperties.background": "#020606",
                    "paneProperties.vertGridProperties.color": "#0a0f0e",
                    "paneProperties.horzGridProperties.color": "#0a0f0e",
                    "symbolWatermarkProperties.transparency": 90,
                    "scalesProperties.textColor": "#666"
                },
                custom_css_url: ""
            });

            tvWidget.onChartReady(() => {
                console.log("ATS Terminal Ready");
            });
        };
    </script>
</body>
</html>
